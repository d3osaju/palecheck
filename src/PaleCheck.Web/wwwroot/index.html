<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PaleCheck</title>
    <meta name="description" content="Phone-based eyelid pallor check with a printed white calibration card. Runs fully offline." />
    <meta name="theme-color" content="#b4234b" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://palecheck.zetalabs.in/" />
    <meta property="og:title" content="PaleCheck — the truth about phone anaemia checks" />
    <meta property="og:description" content="710 patient records, only 312 photographs: 80% of the largest eyelid dataset is copies. And a yellow bulb matters more than anaemia. An honest, offline eyelid pallor check with a ₹1 calibration card." />
    <meta property="og:image" content="https://palecheck.zetalabs.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
            <p>PaleCheck</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">×</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installPrompt = e; });
    </script>
</body>

</html>

name: ci

on:
  push:
  pull_request:

jobs:
  app:
    name: App builds, C# matches Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test PaleCheck.slnx -c Release

  research:
    name: Re-derive every headline number from the public dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y libarchive-tools   # bsdtar, which can unpack the dataset's .rar
      - run: python -m pip install -r model/requirements.txt
      - run: python model/get_data.py
      - run: python model/audit_duplicates.py | head -n 1
      - run: cp model/out/metrics.json "$RUNNER_TEMP/committed-metrics.json"
      - run: python model/train.py
      - run: python model/check_metrics.py "$RUNNER_TEMP/committed-metrics.json" model/out/metrics.json
